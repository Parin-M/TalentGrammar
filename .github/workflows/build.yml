name: Build Chrome extension
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Package extension
        run: cd dist && zip -r ../TalentGrammar-chrome-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: TalentGrammar-chrome-extension
          path: TalentGrammar-chrome-extension.zip
